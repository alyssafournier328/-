<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#4f7cff" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <title>跃升学堂 - 初二升初三学习平台</title>
</head>
<body>
  <div id="app">
    <!-- 顶部导航 -->
    <header class="app-header">
      <div class="brand" data-route="dashboard">
        <span class="brand-logo">跃</span>
        <span class="brand-name">跃升学堂</span>
      </div>
      <nav class="nav-tabs" id="navTabs">
        <a class="nav-tab" data-route="dashboard">学习中心</a>
        <a class="nav-tab" data-route="english">英语</a>
        <a class="nav-tab" data-route="math">数学</a>
        <a class="nav-tab" data-route="chinese">语文</a>
        <a class="nav-tab" data-route="video">视频</a>
        <a class="nav-tab" data-route="community">社区</a>
        <a class="nav-tab" data-route="profile">我的</a>
      </nav>
      <div class="header-right" id="headerRight"></div>
    </header>

    <!-- 主视图 -->
    <main id="view" class="view"></main>

    <!-- 底部导航(移动端) -->
    <nav class="bottom-nav" id="bottomNav">
      <a class="bottom-nav-item" data-route="dashboard">
        <span class="bn-icon">家</span><span class="bn-label">学习</span>
      </a>
      <a class="bottom-nav-item" data-route="english">
        <span class="bn-icon">英</span><span class="bn-label">英语</span>
      </a>
      <a class="bottom-nav-item" data-route="math">
        <span class="bn-icon">数</span><span class="bn-label">数学</span>
      </a>
      <a class="bottom-nav-item" data-route="chinese">
        <span class="bn-icon">语</span><span class="bn-label">语文</span>
      </a>
      <a class="bottom-nav-item" data-route="video">
        <span class="bn-icon">视</span><span class="bn-label">视频</span>
      </a>
      <a class="bottom-nav-item" data-route="community">
        <span class="bn-icon">社</span><span class="bn-label">社区</span>
      </a>
      <a class="bottom-nav-item" data-route="profile">
        <span class="bn-icon">我</span><span class="bn-label">我的</span>
      </a>
    </nav>
  </div>

  <!-- 全局提示 -->
  <div id="toast" class="toast" aria-live="polite"></div>

  <!-- 模态层 -->
  <div id="modal" class="modal-mask" hidden>
    <div class="modal-box" id="modalBox"></div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
